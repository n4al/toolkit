name: Suggest a study
description: Suggest a publication for the Methods Library
title: "[Study suggestion] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a study for the Unequal Exchange Toolkit.

        You do not need to complete a full methodological analysis.
        Please provide what you know and leave optional fields blank.

  - type: input
    id: publication
    attributes:
      label: Publication title
      placeholder: Enter the title of the publication
    validations:
      required: true

  - type: input
    id: authors
    attributes:
      label: Author(s) and year
      placeholder: e.g. Samir Amin, 1974
    validations:
      required: true

  - type: input
    id: link
    attributes:
      label: Publication link or DOI
      placeholder: https://...
    validations:
      required: false

  - type: textarea
    id: relevance
    attributes:
      label: Why should this study be included?
      description: Briefly explain its relevance to the Toolkit.
    validations:
      required: true

  - type: textarea
    id: methodology
    attributes:
      label: Research approach or methodology
      description: Describe what you know about how the study develops or investigates its argument.
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Include relevant sources, connections to other studies, limitations or questions.
    validations:
      required: false
